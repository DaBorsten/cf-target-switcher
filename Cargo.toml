[package]
name = "cf-ts"
version = "0.2.0"
edition = "2021"
description = "Interactively switch Cloud Foundry org and space"
license = "MIT"
repository = "https://github.com/DaBorsten/cf-target-switcher"
readme = "README.md"
keywords = ["cloudfoundry", "cf", "cli", "target"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
console = "0.16"
crossterm = "0.29"
ctrlc = "3"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
